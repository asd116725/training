spring.application.name=training
spring.config.import=optional:file:.env[.properties],optional:file:java/.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/training_carbon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-pro}
deepseek.connect-timeout-ms=${DEEPSEEK_CONNECT_TIMEOUT_MS:5000}
deepseek.read-timeout-ms=${DEEPSEEK_READ_TIMEOUT_MS:28000}

app.invite-codes=${APP_INVITE_CODES:}
